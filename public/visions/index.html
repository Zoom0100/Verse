<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zoom Verse — visioni</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #0b1016;
        color: #e8f0f4;
        padding: 16px;
      }
      h1 {
        font-size: 1.2rem;
        margin: 0 0 8px;
      }
      p {
        color: #9db0bf;
        margin: 0 0 20px;
        font-size: 0.9rem;
      }
      figure {
        margin: 0 0 28px;
      }
      figcaption {
        margin: 8px 0 12px;
        font-weight: 700;
      }
      img {
        width: 100%;
        max-width: 420px;
        border-radius: 12px;
        border: 1px solid #2d3d4c;
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>Zoom Verse — 5 visioni</h1>
    <p>Scegli un numero e scrivilo in chat. Nessun codice applicato.</p>

    <figure>
      <figcaption>1 · Clay / plastilina — terza persona</figcaption>
      <img src="./zoom-vision-clay.jpg" alt="Clay" />
    </figure>
    <figure>
      <figcaption>2 · Ink / fumetto — street RP</figcaption>
      <img src="./zoom-vision-ink.jpg" alt="Ink" />
    </figure>
    <figure>
      <figcaption>3 · Vinyl / figure — collezionabile</figcaption>
      <img src="./zoom-vision-vinyl.jpg" alt="Vinyl" />
    </figure>
    <figure>
      <figcaption>4 · Creator look — personaggio tuo</figcaption>
      <img src="./zoom-vision-creator.jpg" alt="Creator" />
    </figure>
    <figure>
      <figcaption>5 · Casa — vita RP</figcaption>
      <img src="./zoom-vision-home.jpg" alt="Home" />
    </figure>
  </body>
</html>
